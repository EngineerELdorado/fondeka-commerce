# Include once in nginx's http {} context. Apply the access_log directive below
# inside EVERY server/location proxying Commerce API or player traffic, replacing
# inherited/custom access logs there. Request queries and referrers are omitted
# entirely so accessToken (including repeated/encoded parameters) cannot be logged.
log_format commerce_private '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent';

# In each relevant server {} (not here in http {}):
# access_log /var/log/nginx/commerce-access.log commerce_private;
#
# nginx error logs may include the original request on upstream failures. Disable
# them in token-scoped locations, using the deployment's existing proxy settings:
# location ~ ^/public/commerce/(orders|checkouts|training-player)/ {
#     access_log /var/log/nginx/commerce-access.log commerce_private;
#     error_log /dev/null;
#     ... existing proxy_pass, headers, timeouts, etc. ...
# }
